<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PickCat for Android</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --surface: #f8fafd;
      --on-surface: #1f1f1f;
      --muted: #5f6368;
      --container: #ffffff;
      --container-low: #f2f3fa;
      --outline: #c4c7c5;
      --hover: #eef3fc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --primary: #a8c7fa;
        --on-primary: #062e6f;
        --surface: #111318;
        --on-surface: #e2e2e9;
        --muted: #a9adb5;
        --container: #1d2024;
        --container-low: #191c20;
        --outline: #43474e;
        --hover: #282a2f;
      }
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background: var(--surface);
      color: var(--on-surface);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      display: block;
      width: 84px;
      height: 84px;
      margin: 0 auto 14px;
      border-radius: 22px;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -.02em;
    }
    .intro {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 16px 0 0;
    }
    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--container-low);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .download-card {
      margin-top: 22px;
      padding: 18px;
      border: 1px solid var(--outline);
      border-radius: 20px;
      background: var(--container);
    }
    .version-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .version-row strong {
      color: var(--on-surface);
      font-size: 14px;
      font-weight: 600;
    }
    .requirement {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      padding: 0 24px;
      border-radius: 24px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .download:active { opacity: .86; }
    .download svg { width: 20px; height: 20px; flex: none; }
    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      margin-top: 6px;
      padding: 0 16px;
      border-radius: 20px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .secondary svg { width: 17px; height: 17px; flex: none; }
    .secondary:hover, .secondary:focus-visible { background: var(--hover); }
    footer {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

      const endpoint = 'https://pickcat-android.kitter.cn/latest.json';
      const fallbackApk = 'https://pickcat-android.kitter.cn/latest.apk';

      const formatSize = (bytes) => {
        if (!Number.isFinite(bytes) || bytes <= 0) return '';
        const mb = bytes / 1024 / 1024;
        return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.ceil(bytes / 1024)} KB`;
      };

      fetch(endpoint, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('version request failed');
          return response.json();
        })
        .then((data) => {
          if (data.tag) versionEl.textContent = data.tag;
          sizeEl.textContent = formatSize(Number(data.size));
          if (data.url) {
            const url = new URL(data.url, endpoint);
            if (url.protocol === 'https:') downloadEl.href = url.href;
          }
        })
        .catch(() => {
          versionEl.textContent = '最新版本';
          downloadEl.href = fallbackApk;
        });
    })();
  </script>
</body>
</html>
